name: Build Windows Exe

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore TavrynexoUninstaller.sln

    - name: Build & Publish Standalone Windows Exe
      run: |
        dotnet publish src/Tavrynexo.UI/Tavrynexo.UI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableWindowsTargeting=true -o dist/

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TavrynexoUninstaller-Windows-exe
        path: dist/*.exe
